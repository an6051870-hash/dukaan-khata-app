<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukaan Khata</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-24 flex justify-center">

    <!-- Mobile Screen Wrapper -->
    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col justify-between">

        <!-- Main Dynamic View Container -->
        <div id="appContainer"></div>

        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around py-2 shadow-lg z-50">
            <button onclick="switchTab('Dashboard')" class="flex flex-col items-center text-gray-400 text-[11px]">
                <i class="fa-solid fa-chart-line text-lg mb-0.5"></i> Dashboard
            </button>
            <button onclick="switchTab('Bill')" class="flex flex-col items-center text-gray-400 text-[11px]">
                <i class="fa-solid fa-file-lines text-lg mb-0.5"></i> Bill
            </button>
            <button onclick="switchTab('Stock')" class="flex flex-col items-center text-gray-400 text-[11px]">
                <i class="fa-solid fa-box text-lg mb-0.5"></i> Stock
            </button>
            <button onclick="switchTab('Khata')" class="flex flex-col items-center text-purple-950 font-bold text-[11px] border-t-2 border-purple-950 pt-0.5">
                <i class="fa-solid fa-dollar-sign text-lg mb-0.5"></i> Khata
            </button>
            <button onclick="switchTab('Orders')" class="flex flex-col items-center text-gray-400 text-[11px]">
                <i class="fa-solid fa-bars text-lg mb-0.5"></i> Orders
            </button>
        </div>

    </div>

    <!-- JavaScript with Direct Camera Capture -->
    <script>
        let storeName = localStorage.getItem('adv_store_name') || "Raza Super Store";
        let customers = JSON.parse(localStorage.getItem('adv_customers')) || [
            { 
                name: "hadi", 
                transactions: [
                    { type: 'diya', amount: 8000, details: 'Cash & Sugar', image: '', date: '2026-09-23' },
                    { type: 'mila', amount: 100, details: 'Cash Received', image: '', date: '2026-09-23' }
                ] 
            }
        ];

        let currentView = 'home';
        let selectedCustomerIndex = null;

        function getCustomerBalance(cust) {
            let diya = 0;
            let mila = 0;
            cust.transactions.forEach(t => {
                if(t.type === 'diya') diya += t.amount;
                if(t.type === 'mila') mila += t.amount;
            });
            return { balance: diya - mila, diya, mila };
        }

        function render() {
            localStorage.setItem('adv_customers', JSON.stringify(customers));
            let container = document.getElementById('appContainer');

            if (currentView === 'home') {
                let totalMilna = 0;
                let totalDena = 0;

                let listHTML = '';
                if (customers.length === 0) {
                    listHTML = `<p class="text-gray-400 text-center py-4 text-xs">Koi customer mojood nahi hai.</p>`;
                } else {
                    customers.forEach((cust, idx) => {
                        let res = getCustomerBalance(cust);
                        if (res.balance > 0) totalMilna += res.balance;
                        if (res.balance < 0) totalDena += Math.abs(res.balance);

                        let color = res.balance >= 0 ? 'text-emerald-600' : 'text-amber-600';
                        listHTML += `
                            <div onclick="openCustomerDetail(${idx})" class="py-3 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition rounded-xl px-1">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-gray-100 text-gray-600 rounded-full flex items-center justify-center font-bold text-sm">
                                        ${cust.name.charAt(0).toUpperCase()}
                                    </div>
                                    <span class="font-medium text-gray-800 text-sm">${cust.name}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm ${color}">Rs ${res.balance.toLocaleString()}</span>
                                    <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div>
                        <!-- Header Bar -->
                        <div class="bg-white px-4 py-3 flex justify-between items-center border-b border-gray-100 text-gray-700 text-sm">
                            <div class="flex items-center gap-1 font-medium cursor-pointer">Dukaan Khata <i class="fa-solid fa-chevron-down text-xs"></i></div>
                            <div class="flex items-center gap-4 text-gray-500">
                                <i class="fa-regular fa-comment-dots text-lg"></i>
                                <i class="fa-solid fa-expand text-sm"></i>
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </div>
                        </div>

                        <!-- Store Banner -->
                        <div class="bg-purple-950 text-white p-5 m-3 rounded-2xl shadow-md relative">
                            <div class="flex items-start gap-3">
                                <div class="bg-purple-800 bg-opacity-60 p-3 rounded-xl flex items-center justify-center">
                                    <i class="fa-solid fa-store text-xl text-purple-200"></i>
                                </div>
                                <div>
                                    <h1 class="text-xl font-bold tracking-wide">${storeName}</h1>
                                    <p class="text-xs text-purple-300 mt-0.5 cursor-pointer hover:underline" onclick="editStore()">Tap kar ke naam edit karein</p>
                                </div>
                            </div>
                        </div>

                        <!-- Dashboard Cards -->
                        <div class="px-3">
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="text-emerald-600 text-xl font-bold">Rs ${totalMilna.toLocaleString()}</div>
                                    <div class="text-gray-400 text-xs mt-1">Mujhe Milna Hai</div>
                                </div>
                                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="text-amber-600 text-xl font-bold">Rs ${totalDena.toLocaleString()}</div>
                                    <div class="text-gray-400 text-xs mt-1">Mujhe Dena Hai</div>
                                </div>
                            </div>

                            <!-- Add Input -->
                            <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-2 mb-4">
                                <input type="text" id="custInput" placeholder="Naya customer ka naam" class="w-full px-3 py-2 text-sm bg-transparent focus:outline-none text-gray-700 placeholder-gray-400">
                                <button onclick="addNewCust()" class="bg-emerald-100 text-emerald-700 px-5 py-2 rounded-xl font-semibold text-sm hover:bg-emerald-200 transition">Add</button>
                            </div>

                            <!-- Customers Box -->
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-10">
                                <h2 class="text-gray-900 font-bold text-sm mb-3">Customers</h2>
                                <div class="divide-y divide-gray-100">${listHTML}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'detail') {
                let cust = customers[selectedCustomerIndex];
                let res = getCustomerBalance(cust);
                let today = new Date().toISOString().split('T')[0];

                let totalSum = res.diya + res.mila;
                let diyaAngle = totalSum > 0 ? (res.diya / totalSum) * 360 : 360;
                let balanceText = Math.abs(res.balance).toLocaleString();
                let balanceLabel = res.balance >= 0 ? "Milna Hai" : "Dena Hai";
                let balanceColorClass = res.balance >= 0 ? "text-emerald-600" : "text-amber-600";

                let historyHTML = '';
                if(cust.transactions.length === 0) {
                    historyHTML = `<p class="text-gray-400 text-center py-4 text-xs">Abhi koi transaction nahi hai.</p>`;
                } else {
                    [...cust.transactions].reverse().forEach((t, revIdx) => {
                        let actualIdx = cust.transactions.length - 1 - revIdx;
                        let typeText = t.type === 'diya' ? 'Aapne Diya' : 'Aapko Mila';
                        let typeColor = t.type === 'diya' ? 'text-emerald-600' : 'text-amber-600';
                        let imgTag = t.image ? `<img src="${t.image}" class="w-12 h-12 object-cover rounded-lg border mt-1">` : '';
                        historyHTML += `
                            <div class="py-3 flex justify-between items-start border-b border-gray-100">
                                <div>
                                    <div class="font-bold text-sm text-gray-800">${typeText} <span class="text-xs font-normal text-gray-500">(${t.details || 'Cash/Item'})</span></div>
                                    <div class="text-xs text-gray-400 mt-0.5">${t.date}</div>
                                    ${imgTag}
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-sm ${typeColor}">Rs ${t.amount.toLocaleString()}</span>
                                    <button onclick="deleteTx(${actualIdx})" class="w-7 h-7 bg-red-50 text-red-500 rounded-lg flex items-center justify-center hover:bg-red-100"><i class="fa-solid fa-xmark text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div>
                        <!-- Top Bar with Back & Delete -->
                        <div class="bg-white px-4 py-3 flex justify-between items-center border-b border-gray-100">
                            <button onclick="backToHome()" class="flex items-center gap-2 text-gray-700 font-medium text-sm">
                                <i class="fa-solid fa-chevron-left"></i> ${cust.name}
                            </button>
                            <button onclick="deleteCustomer()" class="w-9 h-9 bg-red-50 text-red-500 rounded-xl flex items-center justify-center hover:bg-red-100">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>

                        <div class="p-3">
                            <!-- Circular Donut Chart Card -->
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center mb-3">
                                <div class="relative w-44 h-44 rounded-full flex items-center justify-center shadow-inner" 
                                     style="background: conic-gradient(#10b981 0deg ${diyaAngle}deg, #d97706 ${diyaAngle}deg 360deg);">
                                    <div class="absolute w-32 h-32 bg-white rounded-full flex flex-col items-center justify-center shadow-sm">
                                        <div class="text-base font-extrabold ${balanceColorClass}">Rs ${balanceText}</div>
                                        <div class="text-gray-400 text-[11px] font-medium mt-0.5">${balanceLabel}</div>
                                    </div>
                                </div>

                                <div class="flex items-center justify-center gap-6 mt-5 text-xs">
                                    <div class="flex items-center gap-1.5 font-medium text-gray-700">
                                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                                        <span>Diya: <strong class="text-emerald-600">Rs ${res.diya.toLocaleString()}</strong></span>
                                    </div>
                                    <div class="flex items-center gap-1.5 font-medium text-gray-700">
                                        <span class="w-3 h-3 rounded-full bg-amber-600 inline-block"></span>
                                        <span>Mila: <strong class="text-amber-600">Rs ${res.mila.toLocaleString()}</strong></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Input Form with Direct Camera Capture -->
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                                <div class="mb-3">
                                    <label class="text-xs text-gray-500 font-medium">Amount (Rs)</label>
                                    <input type="number" id="txAmount" placeholder="e.g. 1000" class="w-full mt-1 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-purple-600">
                                </div>
                                <div class="mb-3">
                                    <label class="text-xs text-gray-500 font-medium">Item Details / Kiya Diya (e.g. Sugar, Cash)</label>
                                    <input type="text" id="txDetails" placeholder="Item ya Cash ka naam likhein" class="w-full mt-1 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-purple-600">
                                </div>
                                <div class="mb-3">
                                    <label class="text-xs text-gray-500 font-medium">Product Picture (Camera se banayein)</label>
                                    <div class="mt-1 flex items-center gap-2">
                                        <label class="w-full cursor-pointer bg-purple-50 border border-purple-200 text-purple-900 px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-purple-100 transition">
                                            <i class="fa-solid fa-camera text-base"></i> Camera kholen / Tasveer Lein
                                            <input type="file" id="txImage" accept="image/*" capture="environment" class="hidden">
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="text-xs text-gray-500 font-medium">Date</label>
                                    <input type="date" id="txDate" value="${today}" class="w-full mt-1 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="addTransaction('diya')" class="bg-emerald-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-emerald-700 transition shadow-sm">Aapne Diya</button>
                                    <button onclick="addTransaction('mila')" class="bg-amber-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-amber-700 transition shadow-sm">Aapko Mila</button>
                                </div>
                            </div>

                            <!-- Open Statement Button -->
                            <div class="bg-white p-3 rounded-2xl shadow-sm border border-purple-200 mb-4 text-center cursor-pointer hover:bg-purple-50 transition" onclick="openStatementView()">
                                <span class="text-purple-950 font-bold text-xs flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-file-invoice text-sm"></i> Statement Open Karein (Client ke liye)
                                </span>
                            </div>

                            <!-- History Section -->
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-10">
                                <h3 class="font-bold text-gray-800 text-sm mb-2">History</h3>
                                <div>${historyHTML}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'statement') {
                let cust = customers[selectedCustomerIndex];
                let res = getCustomerBalance(cust);

                let statementRows = '';
                cust.transactions.forEach((t, i) => {
                    let typeText = t.type === 'diya' ? 'Aapne Diya (Udhar)' : 'Aapko Mila (Payment)';
                    let amountColor = t.type === 'diya' ? 'text-emerald-600' : 'text-amber-600';
                    let imgHtml = t.image ? `<img src="${t.image}" class="w-12 h-12 object-cover rounded-lg border mt-2">` : '<span class="text-gray-300 text-xs">No Image</span>';
                    
                    statementRows += `
                        <tr class="border-b border-gray-100">
                            <td class="py-3 px-2 text-xs text-gray-600">${t.date}</td>
                            <td class="py-3 px-2 text-xs font-bold text-gray-800">${typeText}<br><span class="font-normal text-gray-500">${t.details || '-'}</span></td>
                            <td class="py-3 px-2 text-xs text-center">${imgHtml}</td>
                            <td class="py-3 px-2 text-xs text-right font-bold ${amountColor}">Rs ${t.amount.toLocaleString()}</td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <div class="bg-white min-h-screen p-5">
                        <!-- Top Statement Header -->
                        <div class="flex justify-between items-center border-b pb-3 mb-4">
                            <div>
                                <h2 class="font-bold text-lg text-purple-950">${storeName}</h2>
                                <p class="text-xs text-gray-400">Customer Statement: <strong class="text-gray-700">${cust.name}</strong></p>
                            </div>
                            <button onclick="currentView='detail'; render();" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200">
                                <i class="fa-solid fa-xmark mr-1"></i> Band Karein
                            </button>
                        </div>

                        <!-- Summary Box -->
                        <div class="bg-purple-50 p-4 rounded-2xl mb-4 border border-purple-100 flex justify-between items-center">
                            <div>
                                <div class="text-xs text-purple-800 font-medium">Net Balance Total:</div>
                                <div class="text-xl font-bold text-purple-950">Rs ${Math.abs(res.balance).toLocaleString()} (${res.balance >= 0 ? 'Milna Hai' : 'Dena Hai'})</div>
                            </div>
                            <button onclick="window.print()" class="px-4 py-2 bg-purple-900 text-white rounded-xl text-xs font-bold shadow hover:bg-purple-800">
                                <i class="fa-solid fa-print mr-1"></i> Print / Save PDF
                            </button>
                        </div>

                        <!-- Itemized Table -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-500 text-xs border-b">
                                        <th class="py-2 px-2 font-semibold">Date</th>
                                        <th class="py-2 px-2 font-semibold">Details / Item</th>
                                        <th class="py-2 px-2 font-semibold text-center">Picture</th>
                                        <th class="py-2 px-2 font-semibold text-right">Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${statementRows.length > 0 ? statementRows : `<tr><td colspan="4" class="text-center py-4 text-xs text-gray-400">Koi record nahi hai</td></tr>`}
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-8 text-center text-xs text-gray-400 border-t pt-4">
                            Yeh computerized statement Dukaan Khata App se generate ki gayi hai.
                        </div>
                    </div>
                `;
            }
        }

        function editStore() {
            let name = prompt("Store ka naya naam likhein:", storeName);
            if(name && name.trim() !== "") {
                storeName = name.trim();
                localStorage.setItem('adv_store_name', storeName);
                render();
            }
        }

        function addNewCust() {
            let input = document.getElementById('custInput');
            let name = input.value.trim();
            if(!name) {
                alert("Customer ka naam likhna lazmi hai!");
                return;
            }
            customers.push({ name: name, transactions: [] });
            input.value = "";
            render();
        }

        function openCustomerDetail(idx) {
            selectedCustomerIndex = idx;
            currentView = 'detail';
            render();
        }

        function backToHome() {
            currentView = 'home';
            selectedCustomerIndex = null;
            render();
        }

        function openStatementView() {
            currentView = 'statement';
            render();
        }

        function addTransaction(type) {
            let amtInput = document.getElementById('txAmount');
            let detailsInput = document.getElementById('txDetails');
            let dateInput = document.getElementById('txDate');
            let imgInput = document.getElementById('txImage');

            let amount = parseFloat(amtInput.value);
            let details = detailsInput.value.trim() || (type === 'diya' ? 'Udhar / Item' : 'Payment Received');
            let date = dateInput.value;

            if(!amount || amount <= 0) {
                alert("Baraye meherbani sahi amount darj karein!");
                return;
            }

            let file = imgInput.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    customers[selectedCustomerIndex].transactions.push({ type, amount, details, image: e.target.result, date });
                    render();
                };
                reader.readAsDataURL(file);
            } else {
                customers[selectedCustomerIndex].transactions.push({ type, amount, details, image: '', date });
                render();
            }
        }

        function deleteTx(txIdx) {
            if(confirm("Kya aap is entry ko delete karna chahte hain?")) {
                customers[selectedCustomerIndex].transactions.splice(txIdx, 1);
                render();
            }
        }

        function deleteCustomer() {
            if(confirm("Kya aap is customer ko mukammal delete karna chahte hain?")) {
                customers.splice(selectedCustomerIndex, 1);
                currentView = 'home';
                selectedCustomerIndex = null;
                render();
            }
        }

        function switchTab(tab) {
            if(tab !== 'Khata') alert(`${tab} section par mazeed kaam jari hai! पुरानी app elements ko update kar diya gaya hai.`);
        }

        render();
    </script>
</body>
</html>
